<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at 20% 20%, #0a0a1a, #000);
        overflow: hidden;
        color: white;
        font-family: 'Poppins', sans-serif;
    }

    /* ---- Animated Gradient Wave ---- */
    .wave {
        position: absolute;
        bottom: 0;
        width: 200%;
        height: 200px;
        background: linear-gradient(90deg, #4f00ff, #00e1ff, #4f00ff);
        background-size: 200% 100%;
        opacity: 0.6;
        border-radius: 100% 50%;
        animation: moveWaves 8s linear infinite, shiftColors 6s ease-in-out infinite alternate;
        filter: blur(40px);
        z-index: 0;
    }

    .wave:nth-child(2) {
        bottom: -30px;
        opacity: 0.4;
        animation-delay: -4s;
    }

    @keyframes moveWaves {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
    }

    @keyframes shiftColors {
        0% { background-position: 0% 50%; }
        100% { background-position: 100% 50%; }
    }

    /* ---- Main Content ---- */
    .content {
        position: relative;
        text-align: center;
        z-index: 2;
    }

    .content h1 {
        font-size: 2.2rem;
        letter-spacing: 1px;
        color: #fff;
        margin-bottom: 1rem;
    }

    .content p {
        color: #cfcfcf;
        font-size: 1.1rem;
        margin-bottom: 2rem;
    }

    .btn {
        padding: 12px 28px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        transition: 0.3s;
        color: white;
    }

    .btn-login {
        background: linear-gradient(90deg, #4f00ff, #00e1ff);
        margin-right: 10px;
    }

    .btn-register {
        background: linear-gradient(90deg, #ff00b3, #ff7b00);
    }

    .btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 5px 20px rgba(255,255,255,0.2);
    }
</style>
</head>
<body>

    <div class="content">
        <h1>Let's pick up where we left off!</h1>
        <p>Continue by logging in or join us today.</p>
        <a href="/login" class="btn btn-login">Login</a>
        <a href="/register" class="btn btn-register">Register</a>
    </div>

    <!-- Continuous Waves -->
    <div class="wave"></div>
    <div class="wave"></div>

</body>
</html>
