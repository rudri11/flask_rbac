<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Poppins font (same as index) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:radial-gradient(circle at 20% 20%, #0a0a1a, #000);
            overflow:hidden;
            color:white;
            font-family:'Poppins',sans-serif;
        }

        /* ---- Animated Gradient Wave ---- */
        .wave{
            position:absolute; bottom:0; width:200%; height:200px;
            background:linear-gradient(90deg,#4f00ff,#00e1ff,#4f00ff);
            background-size:200% 100%; opacity:0.6;
            border-radius:100% 50%; filter:blur(40px); z-index:0;
            animation:moveWaves 8s linear infinite, shiftColors 6s ease-in-out infinite alternate;
        }
        .wave:nth-child(2){ bottom:-30px; opacity:0.4; animation-delay:-4s; }

        @keyframes moveWaves{ 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
        @keyframes shiftColors{ 0%{background-position:0% 50%} 100%{background-position:100% 50%} }

        /* ---- Main Content ---- */
        .content{
            position:relative; z-index:2; width:100%; max-width:380px;
            background:rgba(255,255,255,0.07);
            backdrop-filter:blur(12px);
            padding:2.5rem;
            border-radius:15px;
            box-shadow:0 20px 60px rgba(0,0,0,0.3);
        }

        .content h2{
            font-size:2rem; letter-spacing:1px; margin-bottom:1rem; text-align:center;
        }
        .content p{
            color:#cfcfcf; font-size:1rem; margin-bottom:2rem; text-align:center;
        }

        /* Flash messages (Flask) */
        .alert{
            padding:12px; border-radius:8px; margin-bottom:1rem;
            font-size:14px; text-align:center;
        }
        .alert-success{background:#d4edda;color:#155724;border:1px solid #c3e6cb;}
        .alert-danger{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb;}
        .alert-info{background:#d1ecf1;color:#0c5460;border:1px solid #bee5eb;}

        /* Form */
        .form-group{margin-bottom:1.5rem;}
        label{
            display:block; color:#ddd; margin-bottom:.5rem; font-weight:500;
        }
        input[type="text"], input[type="password"]{
            width:100%; padding:14px 16px; border:none; border-radius:8px;
            background:rgba(255,255,255,0.12); color:white; font-size:1rem;
            outline:none; transition:.3s;
        }
        input::placeholder{color:#bbb;}
        input:focus{
            background:rgba(255,255,255,0.22);
            box-shadow:0 0 0 2px #4f00ff;
        }

        .btn{
            width:100%; padding:14px; border:none; border-radius:8px;
            background:linear-gradient(90deg,#4f00ff,#00e1ff);
            color:white; font-weight:600; font-size:1rem;
            cursor:pointer; transition:.3s;
        }
        .btn:hover{
            transform:translateY(-3px);
            box-shadow:0 5px 20px rgba(255,255,255,0.2);
        }

        .register-link{
            text-align:center; margin-top:1.5rem; font-size:.9rem; color:#bbb;
        }
        .register-link a{
            color:#00e1ff; text-decoration:none; font-weight:600;
        }
        .register-link a:hover{ text-decoration:underline; }
    </style>
</head>
<body>

    <!-- Waves (identical to index) -->
    <div class="wave"></div>
    <div class="wave"></div>

    <div class="content">
        <h2>Please Login!</h2>
        <p>Enter your credentials below.</p>

        <!-- Flask flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>

            <button type="submit" class="btn">Login</button>
        </form>

        <div class="register-link">
            Don't have an account? <a href="/register">Register here</a>
        </div>
    </div>

</body>
</html>
